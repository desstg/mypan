services:
  litepan:
    image: desstg/mypan:latest
    container_name: litepan
    restart: unless-stopped
    ports:
      - "5211:5211"
      # Emby / 飞牛影视反代的监听端口。反代是监听在容器内部的，
      # 不在这里发布出去，播放器就连不上（表现只是「连不上服务器」）。
      # 端口号必须与后台「代理工具 → 反代端口」保持一致；用不到反代可以删掉这行。
      - "18097:18097"
      # 内置 Magnet 的 TCP/uTP/DHT 监听端口，默认不开启；要用内置磁力下载时
      # 取消下面两行的注释（TCP 和 UDP 必须都给，只给 TCP 会导致 DHT 找不到节点）
      # - "42069:42069/tcp"
      # - "42069:42069/udp"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./strm:/app/strm
      - ./mounts:/app/mounts:shared

      # 可选：将 FUSE 读缓存单独映射，建议放到更快的磁盘
      # - ./fuse_read_cache:/app/data/fuse_read_cache
    devices:
      - /dev/fuse:/dev/fuse
    pid: "host"
    privileged: true
