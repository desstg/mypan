# 构建并推送 Docker 镜像到 Docker Hub，并把 Windows 免安装 exe 传到 Release。
#
# 触发方式**刻意只有两种**，都不碰 push 事件 —— 平时提交代码不会触发构建：
#   1. 发 tag：`git tag v2.0.1 && git push origin v2.0.1`
#   2. 网页手动：Actions → 本 workflow → Run workflow，填版本号
#      （手动触发只补镜像，**不发 exe** —— 见 windows job 的说明）
#
# ⚠️ **默认只编 amd64**。这不是偷懒，是踩过一次：
#
# 最初默认编 amd64 + arm64，结果跑了近 4 小时没完。原因是 arm64 那一半在
# amd64 的 runner 上走 **QEMU 软件模拟**，而 Dockerfile 里最重的活全在前端阶段：
# `npm ci` 装近九千个依赖包、`vue-tsc` 全项目类型检查、`vite build` + gzip，
# 再叠上 `go build` 静态编译。模拟环境里这些比原生慢十几倍。
#
# 而群晖 / 绝大多数自建场景都是 x86，amd64 是**原生**执行，几分钟到十几分钟就完。
# 真要发 ARM 版时，手动触发时把 platforms 填成 `linux/amd64,linux/arm64` 即可
# —— 那种情况请预留一小时以上。
#
# Dockerfile 不用改 —— 它刻意避开了 BuildKit 专属语法（见其顶部注释），
# 在 Actions 的 buildx 上照样能跑。
name: Build and push image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v2.0.1）"
        required: true
        type: string
      platforms:
        description: "目标架构。默认只编 amd64（快）。要发 ARM 版填 linux/amd64,linux/arm64 —— 那一趟要一小时以上"
        required: false
        default: "linux/amd64"
        type: string

env:
  IMAGE: desstg/mypan

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号的三个来源，优先级从高到低：
      #   1. 手动触发时填的那个
      #   2. tag 名（refs/tags/v2.0.1 → v2.0.1）
      #   3. 兜底用提交短 sha —— 只该在异常情况下走到
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="sha-$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "构建版本：$V"

      # buildx 是 build-push-action 的前置；QEMU 用来在 amd64 的 runner 上
      # 模拟 arm64（没有它只能出单架构）。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: desstg
          password: ${{ secrets.DOCKER_TOKEN }}

      # 平台：手动触发填了就用填的，否则 amd64（tag 触发走这里）。
      # tag 触发时不编 arm64 是**刻意的** —— 见文件顶部那段说明。
      - name: Resolve platforms
        id: plat
        run: |
          P="${{ inputs.platforms }}"
          [ -z "$P" ] && P="linux/amd64"
          echo "platforms=$P" >> "$GITHUB_OUTPUT"
          echo "目标架构：$P"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.plat.outputs.platforms }}
          # VERSION 会经 -ldflags 写进「关于」页的 buildinfo.Version，
          # 与本地 `docker build --build-arg VERSION=...` 是同一个入口。
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          # 云端缓存：不配的话每次都要从头 npm ci + go mod download。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

      - name: Summary
        run: |
          {
            echo "## 镜像已推送"
            echo ""
            echo "| tag | 说明 |"
            echo "|---|---|"
            echo "| \`${{ env.IMAGE }}:${{ steps.ver.outputs.version }}\` | 本次版本 |"
            echo "| \`${{ env.IMAGE }}:latest\` | 同时更新 |"
            echo ""
            echo "平台：\`${{ steps.plat.outputs.platforms }}\`"
            echo ""
            echo "群晖上拉取：\`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Windows 免安装 exe，传到对应的 Release 里。
  #
  # 与镜像**分开一个 job、且不写 needs**：它不需要 buildx / QEMU / Docker Hub
  # 凭据，也不该被镜像那一步的失败连坐（镜像挂了照样能发 exe）。
  #
  # ⚠️ 只在 tag 触发时跑：手动触发那一路是补镜像，版本号是手填的，
  # 而 `gh release upload` 需要一个**已存在**的 Release（手填的版本号常常没有）。
  windows:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows amd64
        run: |
          V="${GITHUB_REF_NAME}"
          # ⚠️ 不加 `-tags fuse`：FUSE 挂载是 Linux 专属，Windows 上编不过。
          # 这与作本地 `go build ./cmd/litepan` 同一条路径（Makefile 的 build-nofuse）。
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath -ldflags "-s -w -X litepan/internal/buildinfo.Version=${V}" \
            -o "mypan-${V}-windows-amd64.exe" ./cmd/litepan
          ls -lh "mypan-${V}-windows-amd64.exe"
          sha256sum "mypan-${V}-windows-amd64.exe" | tee "mypan-${V}-windows-amd64.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME}"
          # ⚠️ 要等一下：Release 可能比这个 job 晚一步建出来（tag 一推 workflow
          # 就起跑，而 `gh release create` 是随后手动跑的）。没它 `gh release
          # upload` 直接报错，exe 就白编了。等 3 分钟足够覆盖那个窗口。
          for i in $(seq 1 12); do
            if gh release view "$V" >/dev/null 2>&1; then break; fi
            echo "等待 Release ${V} 出现…（${i}/12）"
            sleep 15
          done
          gh release upload "$V" \
            "mypan-${V}-windows-amd64.exe" \
            "mypan-${V}-windows-amd64.sha256" \
            --clobber
